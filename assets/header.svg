<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Ehsanur Rahman — Mobile and Full-Stack AI Engineer, Founder of Hourwise Labs" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0E1512"/>
      <stop offset="0.6" stop-color="#15291F"/>
      <stop offset="1" stop-color="#1F4D3A"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.84" cy="0.5" r="0.35">
      <stop offset="0" stop-color="#E0B45A" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#E0B45A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F0CB7A"/>
      <stop offset="1" stop-color="#C9972F"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#E7EEEA" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
    <style>
      .name { font: 700 58px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #E7EEEA; letter-spacing: -0.5px; }
      .role { font: 600 24px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #E0B45A; }
      .stack { font: 400 18px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #A7B5AD; }
      .seg { fill: none; stroke-width: 16; stroke-linecap: butt; }
      .off { stroke: #2C6450; }
      .on { stroke: url(#brass); animation: fill 0.5s ease-out both, pulse 3.2s ease-in-out 1.6s infinite; }
      .fade { animation: in 0.8s ease-out both; }
      .d1 { animation-delay: 0.1s; } .d2 { animation-delay: 0.35s; } .d3 { animation-delay: 0.6s; }
      @keyframes fill { from { opacity: 0; } to { opacity: 1; } }
      @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.65; } }
      @keyframes in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
      @media (prefers-reduced-motion: reduce) { .on, .fade { animation: none; } }
    </style>
  </defs>
  <rect width="1200" height="300" rx="16" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="16" fill="url(#grid)"/>
  <rect width="1200" height="300" rx="16" fill="url(#glow)"/>
  <text x="70" y="128" class="name fade d1">Ehsanur Rahman</text>
  <text x="72" y="178" class="role fade d2">Mobile &amp; Full-Stack AI Engineer · Founder, Hourwise Labs</text>
  <text x="72" y="218" class="stack fade d3">Flutter · React Native · Swift · Python — offline-first sync, on-device AI</text>
  <g>
    <path d="M 1014.0 58.1 A 92 92 0 0 1 1060.8 73.3" class="seg on" style="animation-delay:0.00s, 1.6s"/>
    <path d="M 1067.3 78.0 A 92 92 0 0 1 1096.2 117.8" class="seg on" style="animation-delay:0.35s, 1.6s"/>
    <path d="M 1098.7 125.4 A 92 92 0 0 1 1098.7 174.6" class="seg on" style="animation-delay:0.70s, 1.6s"/>
    <path d="M 1096.2 182.2 A 92 92 0 0 1 1067.3 222.0" class="seg off"/>
    <path d="M 1060.8 226.7 A 92 92 0 0 1 1014.0 241.9" class="seg off"/>
    <path d="M 1006.0 241.9 A 92 92 0 0 1 959.2 226.7" class="seg off"/>
    <path d="M 952.7 222.0 A 92 92 0 0 1 923.8 182.2" class="seg off"/>
    <path d="M 921.3 174.6 A 92 92 0 0 1 921.3 125.4" class="seg off"/>
    <path d="M 923.8 117.8 A 92 92 0 0 1 952.7 78.0" class="seg off"/>
    <path d="M 959.2 73.3 A 92 92 0 0 1 1006.0 58.1" class="seg off"/>
    <line x1="1010" y1="150" x2="1065.2" y2="167.9" stroke="url(#brass)" stroke-width="7" stroke-linecap="round"/>
    <circle cx="1010" cy="150" r="10" fill="url(#brass)"/>
  </g>
</svg>
