<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Senior Flutter Engineer | Native iOS, Android &amp; macOS Remote, no visa needed" >
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0E1512"/>
      <stop offset="0.6" stop-color="#15291F"/>
      <stop offset="1" stop-color="#1F4D3A"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.84" cy="0.5" r="0.35">
      <stop offset="0" stop-color="#E0B45A" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#E0B45A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F0CB7A"/>
      <stop offset="1" stop-color="#C9972F"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#E7EEEA" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
    <style>
      .name { font: 700 58px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #E7EEEA; letter-spacing: -0.5px; }
      .role { font: 600 24px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #E0B45A; }
      .stack { font: 400 18px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #A7B5AD; }
      .seg { fill: none; stroke-width: 16; stroke-linecap: butt; }
      .off { stroke: #2C6450; }
      .on { stroke: url(#brass); animation: fill 0.5s ease-out both, pulse 3.2s ease-in-out 1.6s infinite; }
      .fade { animation: in 0.8s cubic-bezier(.2,.75,.25,1) both; }
      .d1 { animation-delay: 0.1s; } .d2 { animation-delay: 0.35s; } .d3 { animation-delay: 0.6s; }
      .ambient { opacity: .68; animation: glow-breathe 7s ease-in-out infinite; }
      .clock { opacity: 0; transform-box: view-box; transform-origin: 1010px 150px; animation: clock-arrive 1.15s cubic-bezier(.16,.75,.25,1) .18s forwards; }
      .hand { transform-box: fill-box; transform-origin: 0% 0%; animation: hand-turn 28s linear infinite; }
      .orbit { transform-box: view-box; transform-origin: 1010px 150px; animation: orbit 11s linear infinite; }
      .sweep { fill: none; stroke: #F0CB7A; stroke-width: 2.2; stroke-linecap: round; stroke-dasharray: 56 522; stroke-dashoffset: 0; opacity: .92; animation: sweep 8s linear infinite; }
      .core-ripple { fill: none; stroke: #F0CB7A; stroke-width: 1.5; opacity: 0; transform-box: view-box; transform-origin: 1010px 150px; animation: ripple 3.4s ease-out 1.2s infinite; }
      .underline-line { fill: none; stroke: #E0B45A; stroke-width: 3; stroke-linecap: round; stroke-dasharray: 270; stroke-dashoffset: 270; animation: underline-draw 1s ease-out .72s forwards, underline-glow 4.5s ease-in-out 1.8s infinite; }
      .particle { fill: #F0CB7A; opacity: .48; animation: particle-float 4.8s ease-in-out infinite; }
      .p2 { animation-delay: -1.4s; } .p3 { animation-delay: -2.8s; }
      @keyframes fill { from { opacity: 0; } to { opacity: 1; } }
      @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.68; } }
      @keyframes in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes glow-breathe { 0%,100% { opacity: .52; } 50% { opacity: .95; } }
      @keyframes clock-arrive { from { opacity: 0; transform: scale(.82) rotate(-8deg); } to { opacity: 1; transform: scale(1) rotate(0deg); } }
      @keyframes hand-turn { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
      @keyframes orbit { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
      @keyframes sweep { from { stroke-dashoffset: 0; } to { stroke-dashoffset: -578; } }
      @keyframes ripple { 0% { opacity: .62; transform: scale(.7); } 80%,100% { opacity: 0; transform: scale(2.5); } }
      @keyframes underline-draw { to { stroke-dashoffset: 0; } }
      @keyframes underline-glow { 0%,100% { opacity: .82; } 50% { opacity: 1; } }
      @keyframes particle-float { 0%,100% { transform: translateY(0); opacity: .24; } 50% { transform: translateY(-9px); opacity: .7; } }
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation: none !important; }
        .clock { opacity: 1; transform: none; }
        .underline-line { stroke-dashoffset: 0; opacity: .9; }
        .ambient { opacity: .7; }
        .core-ripple { opacity: .3; transform: none; }
      }
    </style>
  </defs>
  <rect width="1200" height="300" rx="16" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="16" fill="url(#grid)"/>
  <rect class="ambient" width="1200" height="300" rx="16" fill="url(#glow)"/>
  <text x="70" y="128" class="name fade d1">Ehsanur Rahman</text>
  <path class="underline-line" d="M 72 148 H 340"/>
  <text x="72" y="178" class="role fade d2">Senior Flutter Engineer · Founder, Hourwise Labs</text>
  <text x="72" y="218" class="stack fade d3">Native iOS, Android, macOS — offline-first sync, on-device AI</text>
  <g class="clock">
    <path d="M 1014.0 58.1 A 92 92 0 0 1 1060.8 73.3" class="seg on" style="animation-delay:0.00s, 1.6s"/>
    <path d="M 1067.3 78.0 A 92 92 0 0 1 1096.2 117.8" class="seg on" style="animation-delay:0.35s, 1.6s"/>
    <path d="M 1098.7 125.4 A 92 92 0 0 1 1098.7 174.6" class="seg on" style="animation-delay:0.70s, 1.6s"/>
    <path d="M 1096.2 182.2 A 92 92 0 0 1 1067.3 222.0" class="seg off"/>
    <path d="M 1060.8 226.7 A 92 92 0 0 1 1014.0 241.9" class="seg off"/>
    <path d="M 1006.0 241.9 A 92 92 0 0 1 959.2 226.7" class="seg off"/>
    <path d="M 952.7 222.0 A 92 92 0 0 1 923.8 182.2" class="seg off"/>
    <path d="M 921.3 174.6 A 92 92 0 0 1 921.3 125.4" class="seg off"/>
    <path d="M 923.8 117.8 A 92 92 0 0 1 952.7 78.0" class="seg off"/>
    <path d="M 959.2 73.3 A 92 92 0 0 1 1006.0 58.1" class="seg off"/>
    <circle class="sweep" cx="1010" cy="150" r="92"/>
    <circle class="core-ripple" cx="1010" cy="150" r="15"/>
    <g class="orbit">
      <circle cx="1010" cy="58" r="4.2" fill="#F0CB7A"/>
      <circle cx="1010" cy="58" r="8.5" fill="none" stroke="#F0CB7A" stroke-opacity=".45" stroke-width="1.2"/>
    </g>
    <circle class="particle p1" cx="884" cy="77" r="1.8"/>
    <circle class="particle p2" cx="901" cy="211" r="1.4"/>
    <circle class="particle p3" cx="868" cy="153" r="1.2"/>
    <line class="hand" x1="1010" y1="150" x2="1065.2" y2="167.9" stroke="url(#brass)" stroke-width="7" stroke-linecap="round"/>
    <circle cx="1010" cy="150" r="10" fill="url(#brass)"/>
    <circle cx="1010" cy="150" r="15" fill="none" stroke="#F0CB7A" stroke-opacity=".26" stroke-width="1"/>
  </g>
</svg>
